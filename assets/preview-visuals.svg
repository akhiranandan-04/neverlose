<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Neverlose visuals concept</title>
  <desc id="desc">An original top-down tactical map concept with player boxes, a radar, and a visual settings panel. This is not a game screenshot.</desc>
  <defs>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="68%">
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="720" fill="url(#map)"/>
  <rect width="900" height="720" fill="url(#grid)"/>

  <path d="M90 650L270 500L470 320L720 170" fill="none" stroke="#1a222e" stroke-width="64" stroke-linecap="square"/>
  <path d="M180 100L340 240L520 310L700 480L820 650" fill="none" stroke="#151c26" stroke-width="54" stroke-linecap="square"/>
  <path d="M80 360L300 330L520 310L760 220" fill="none" stroke="#151c26" stroke-width="40" stroke-linecap="square"/>
  <path d="M90 650L270 500L470 320L720 170" fill="none" stroke="#232c3a" stroke-width="1" opacity="0.65"/>
  <path d="M180 100L340 240L520 310L700 480L820 650" fill="none" stroke="#232c3a" stroke-width="1" opacity="0.55"/>

  <rect x="274" y="162" width="146" height="110" rx="6" fill="#0e141d" stroke="#303948" stroke-width="1.5"/>
  <text x="347" y="228" text-anchor="middle" fill="#566173" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">A</text>
  <text x="347" y="250" text-anchor="middle" fill="#677184" font-family="Consolas, monospace" font-size="9" letter-spacing="1.6">SITE A</text>

  <rect x="612" y="430" width="146" height="110" rx="6" fill="#0e141d" stroke="#303948" stroke-width="1.5"/>
  <text x="685" y="496" text-anchor="middle" fill="#566173" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">B</text>
  <text x="685" y="518" text-anchor="middle" fill="#677184" font-family="Consolas, monospace" font-size="9" letter-spacing="1.6">SITE B</text>

  <circle cx="486" cy="318" r="42" fill="#0b1119" stroke="#2d3746" stroke-width="1.5"/>
  <text x="486" y="322" text-anchor="middle" fill="#677184" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">MID</text>

  <text x="70" y="650" fill="#4f5a6c" font-family="Consolas, monospace" font-size="9" letter-spacing="1.8">T SPAWN</text>
  <text x="736" y="70" fill="#4f5a6c" font-family="Consolas, monospace" font-size="9" letter-spacing="1.8">CT SPAWN</text>

  <rect x="20" y="20" width="230" height="32" rx="4" fill="#0a0d13" fill-opacity="0.8" stroke="#242b38"/>
  <text x="34" y="40" fill="#8b94a7" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">CONCEPT MAP / LEGACY CS:GO</text>

