    <rect x="646" y="442" width="54" height="4" rx="2" fill="#241017"/>
  </g>

  <g>
    <rect x="696" y="540" width="50" height="88" fill="#57d68d" fill-opacity="0.04" stroke="#57d68d" stroke-width="1.5"/>
    <path d="M696 540H746M696 628H746" stroke="#57d68d" stroke-width="3"/>
    <rect x="696" y="534" width="124" height="16" rx="2" fill="#0b1711" stroke="#24543a"/>
    <text x="702" y="546" fill="#a7e9c3" font-family="Consolas, monospace" font-size="9" letter-spacing="0.8">TEAM / 87 HP</text>
    <rect x="696" y="634" width="50" height="4" rx="2" fill="#0f2419"/>
    <rect x="696" y="634" width="36" height="4" rx="2" fill="#57d68d"/>
  </g>

  <g transform="translate(486 360)">
    <path d="M-18 0H-6M6 0H18M0-18V-6M0 6V18" stroke="#f2f4f8" stroke-width="2"/>
    <circle r="2" fill="#ff5562"/>
  </g>

  <rect width="900" height="720" fill="url(#vignette)"/>
  <text x="20" y="696" fill="#5e6879" font-family="Consolas, monospace" font-size="9" letter-spacing="1.4">ILLUSTRATIVE PREVIEW / NOT A GAME CAPTURE</text>

