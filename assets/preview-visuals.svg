  <circle cx="1241" cy="287" r="8" fill="#ffffff"/>

  <path d="M924 316H1256" stroke="#242a37"/>
  <text x="924" y="348" fill="#ff6f79" font-family="Consolas, monospace" font-size="10" letter-spacing="2">WORLD</text>

  <text x="924" y="384" fill="#d9dee8" font-family="Segoe UI, Arial, sans-serif" font-size="14">World color</text>
  <rect x="1208" y="372" width="44" height="22" rx="11" fill="#e02d3c"/>
  <circle cx="1241" cy="383" r="8" fill="#ffffff"/>

  <text x="924" y="424" fill="#d9dee8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Smoke</text>
  <rect x="1208" y="412" width="44" height="22" rx="11" fill="#1b2130" stroke="#303747"/>
  <circle cx="1219" cy="423" r="8" fill="#697386"/>

  <text x="924" y="464" fill="#d9dee8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Skybox</text>
