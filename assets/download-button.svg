<svg xmlns="http://www.w3.org/2000/svg" width="600" height="128" viewBox="0 0 600 128" role="img" aria-labelledby="title desc">
  <title id="title">Download Neverlose for Windows</title>
  <desc id="desc">A red download button with a tray icon and the text Download for Windows.</desc>
  <defs>
