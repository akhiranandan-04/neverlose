name: Guide or documentation request
description: Suggest a topic that would make the hub more useful.
title: "[Guide]: "
labels: ["enhancement"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: What should the documentation cover?
      placeholder: "Legacy CS:GO compatibility checklist"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it useful?
      description: Describe the problem this page would prevent or solve.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources or examples
      description: Optional public references that can be verified. Do not attach private configs or archives.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request is about documentation, not vendor support.
          required: true
        - label: I did not include account data, credentials, or executable files.
          required: true
